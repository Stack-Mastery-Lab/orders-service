server:
  port: 8082 # Puerto único para el servicio de órdenes

spring:
  application:
    name: orders-service
  datasource:
    url: jdbc:postgresql://localhost:5432/db_orders?createDatabaseIfNotExist=true
    username: admin
    password: admin
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true